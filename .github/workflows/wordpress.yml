name: Sync Astro to WordPress
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'wordpress/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.github/workflows/wordpress.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Trigger source'
        required: false
        default: manual
        type: choice
        options: [manual, wordpress]
permissions:
  contents: write
concurrency:
  group: wordpress-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: wordpress-production
    env:
      WORDPRESS_SITE_URL: https://melting-poppo.com
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm exec --yes --package=@yarnpkg/cli-dist@4.18.0 -- yarn install --immutable
      - name: Pull WordPress edits and deletions
        id: pull
        env:
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: node --import tsx wordpress/scripts/pull.ts
      - name: Build the existing Astro website
        if: github.event_name != 'schedule' || steps.pull.outputs.publish == 'true'
        run: node node_modules/astro/astro.js build
      - name: Package WordPress build, plugin and theme
        if: github.event_name != 'schedule' || steps.pull.outputs.publish == 'true'
        run: node --import tsx wordpress/scripts/package.ts
      - name: Validate PHP and package
        if: github.event_name != 'schedule' || steps.pull.outputs.publish == 'true'
        run: |
          php -l wordpress/plugin/swingby-git-sync/swingby-git-sync.php
          php -l wordpress/plugin/swingby-git-sync/bidirectional.php
          php -l wordpress/plugin/swingby-git-sync/immediate.php
          node --import tsx --test wordpress/tests/pull.test.ts
          php -l wordpress/theme/swingby-astro/index.php
          php wordpress/tests/validate.php
      - if: github.event_name != 'schedule' || steps.pull.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wordpress-packages
          path: wordpress-build/*.zip
          retention-days: 14
      - name: Commit validated WordPress changes
        if: steps.pull.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx wordpress/scripts/commit-pull.ts
      - name: Send to WordPress staging
        if: steps.pull.outputs.supported == 'true' && (github.event_name != 'schedule' || steps.pull.outputs.publish == 'true')
        env:
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: |
          if [ -z "$WORDPRESS_USERNAME" ] || [ -z "$WORDPRESS_APP_PASSWORD" ]; then
            echo 'Download wordpress-packages, install the plugin/theme, then configure the two environment secrets and rerun.'
            exit 1
          fi
          node --import tsx wordpress/scripts/send.ts
