name: Verify site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack yarn@4.18.1 install --immutable
      - run: corepack yarn@4.18.1 test
      - run: corepack yarn@4.18.1 build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
